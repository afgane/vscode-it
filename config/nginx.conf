# nginx fragments for the VS Code interactive tool on a CONVENTIONAL server, where
# gx-it-proxy (port 4002 below) sits between nginx and the containers. Kubernetes
# deployments need none of this: the job runner creates an Ingress per session.
# Taken from the GTN "Galaxy Interactive Tools" admin tutorial.

